<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pago No Completado | El Brujo Rodrigo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --dorado: #c9a66b;
      --dorado-claro: #e8d5a3;
      --bg: #0d0a06;
      --text: #f5efe4;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--bg);
      background-image: url('og-image.jpg');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      color: var(--text);
      font-family: 'Poppins', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      padding-top: max(40px, env(safe-area-inset-top));
      padding-bottom: max(40px, env(safe-area-inset-bottom));
      position: relative;
    }

    /* Overlay oscuro sobre la imagen */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, rgba(10,6,2,0.72) 0%, rgba(10,6,2,0.85) 50%, rgba(10,6,2,0.92) 100%);
      z-index: 0;
    }

    /* Brillo diagonal */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(
        115deg,
        transparent 0%,
        transparent 30%,
        rgba(201,166,107,0.04) 40%,
        rgba(201,166,107,0.09) 50%,
        rgba(201,166,107,0.04) 60%,
        transparent 70%,
        transparent 100%
      );
      background-size: 250% 100%;
      background-position: 200% 0;
      z-index: 0;
      pointer-events: none;
      animation: brillo 6s ease-in-out infinite;
    }

    @keyframes brillo {
      0%   { background-position: 200% 0; }
      100% { background-position: -100% 0; }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 520px;
      width: 100%;
      text-align: center;
    }

    .label-top {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--dorado);
      margin-bottom: 36px;
      display: block;
      opacity: 0.7;
    }

    .card {
      border: 1px solid rgba(201,166,107,0.3);
      border-radius: 4px;
      padding: 48px 32px 40px;
      background: rgba(13,10,6,0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      position: relative;
    }

    /* Esquinas decorativas */
    .card::before, .card::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
    }
    .card::before {
      top: -1px; left: -1px;
      border-top: 2px solid rgba(201,166,107,0.5);
      border-left: 2px solid rgba(201,166,107,0.5);
    }
    .card::after {
      bottom: -1px; right: -1px;
      border-bottom: 2px solid rgba(201,166,107,0.5);
      border-right: 2px solid rgba(201,166,107,0.5);
    }

    .icon {
      font-size: 38px;
      margin-bottom: 20px;
      display: block;
      opacity: 0.75;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: clamp(20px, 5vw, 28px);
      color: var(--dorado-claro);
      line-height: 1.25;
      letter-spacing: 0.04em;
      margin-bottom: 10px;
    }

    .subtitulo {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 600;
      font-size: 17px;
      color: rgba(201,166,107,0.75);
      margin-bottom: 12px;
    }

    .detalle {
      font-size: 13px;
      color: #8a7d6a;
      font-family: 'Poppins', sans-serif;
      font-weight: 300;
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .btn-reintentar {
      display: inline-block;
      background: linear-gradient(135deg, var(--dorado), #b8924f);
      color: #0d0a06;
      text-decoration: none;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 16px 36px;
      border-radius: 50px;
      transition: opacity 0.2s, transform 0.15s;
      margin-bottom: 28px;
      cursor: pointer;
    }
    .btn-reintentar:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }
    .btn-reintentar:active {
      transform: translateY(0);
    }

    .divider {
      border: none;
      border-top: 1px solid rgba(201,166,107,0.12);
      margin: 0 0 20px;
    }

    .nota {
      font-size: 12px;
      color: #7a6e5e;
      font-family: 'Poppins', sans-serif;
      font-weight: 300;
      line-height: 1.6;
    }
    .nota a {
      color: rgba(201,166,107,0.7);
      text-decoration: none;
    }
    .nota a:hover {
      color: var(--dorado);
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="label-top">El Brujo Rodrigo</span>

    <div class="card">
      <span class="icon">⚠️</span>
      <h1>El pago no se completó</h1>
      <p class="subtitulo">Podés volver a intentarlo cuando quieras.</p>
      <p class="detalle">
        Tu reserva aún no está confirmada.<br>
        No se realizó ningún cobro.
      </p>

      <a class="btn-reintentar" href="https://puntodequiebre-rodrigo.netlify.app/?pagar=1">
        Volver a intentar el pago
      </a>

      <hr class="divider">

      <p class="nota">
        ¿Problemas con tu pago? <a href="mailto:soporte@ayresdebahia.com">soporte@ayresdebahia.com</a> · <a href="https://wa.me/541154165342" target="_blank">WhatsApp</a>
      </p>
    </div>
  </div>
</body>
</html>
